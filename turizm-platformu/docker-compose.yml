version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: turizm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: trabzon_turizm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trabzon_turizm"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: turizm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: turizm-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    # No volumes needed

  # Optional: LibreTranslate for translations
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: turizm-libretranslate
    ports:
      - "5000:5000"
    environment:
      - LT_LOAD_ONLY=tr,en,ru,ar,de
    # volumes:
    #   - libretranslate_data:/home/libretranslate/.local/share/argos-translate

volumes:
  postgres_data:
  redis_data:
  # libretranslate_data: