name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: turizm-platformu/package-lock.json
      - name: Install
        working-directory: turizm-platformu
        run: npm ci
      - name: Build web
        working-directory: turizm-platformu/apps/web
        env:
          VITE_BASE_PATH: /DuguKaradenizGeziyorum/
        run: npm run build
      - name: SPA fallback
        working-directory: turizm-platformu/apps/web
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: turizm-platformu/apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
