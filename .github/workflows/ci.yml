name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: turizm-platformu/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: turizm-platformu/package-lock.json
      - name: Install (workspace root)
        working-directory: turizm-platformu
        run: npm ci
      - name: Build web
        run: npm run build

  api-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: turizm-platformu/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: turizm-platformu/package-lock.json
      - name: Install
        working-directory: turizm-platformu
        run: npm ci
      - name: Typecheck API
        run: npx tsc --noEmit
