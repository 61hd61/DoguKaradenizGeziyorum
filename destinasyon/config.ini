; =====================================================================
; Turizm Veri Yonetim Paneli - Yapilandirma
; Bu dosya app.exe ile AYNI klasorde bulunmalidir.
;
; Buradaki [database] ayarlari su ortam degiskenleriyle gecici olarak
; ezilebilir (dosyaya yazilmaz): TURIZM_DB_HOST, TURIZM_DB_PORT,
; TURIZM_DB_NAME, TURIZM_DB_USER, TURIZM_DB_PASSWORD, TURIZM_DB_SSLMODE
; =====================================================================

[database]
host = localhost
port = 5432
dbname = trabzon_turizm
user = postgres
password = 1234
; SSL modu: disable | allow | prefer | require
sslmode = prefer
; Baglanti zaman asimi (saniye)
connect_timeout = 5

[application]
; Resimlerin kopyalanacagi klasor (exe'ye goreceli)
images_dir = images
; Arayuz temasi: dark | light
theme = dark
; Tablo onizlemesinde gosterilecek maksimum kayit (0 = sinirsiz)
max_rows = 0
