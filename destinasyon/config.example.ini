; =====================================================================
; Turizm Veri Yonetim Paneli - Yapilandirma SABLONU
; Bu dosyayi app.exe ile AYNI klasore "config.ini" adıyla kopyalayin
; ve asagidaki baglanti bilgilerini kendi sunucunuza gore doldurun.
;
; Ortam degiskenleriyle de ezilebilir (dosyaya yazilmaz):
;   TURIZM_DB_HOST, TURIZM_DB_PORT, TURIZM_DB_NAME,
;   TURIZM_DB_USER, TURIZM_DB_PASSWORD, TURIZM_DB_SSLMODE
; =====================================================================

[database]
host = localhost
port = 5432
dbname = trabzon_turizm
user = postgres
password =
; SSL modu: disable | allow | prefer | require
sslmode = prefer
; Baglanti zaman asimi (saniye)
connect_timeout = 5

[application]
; Resimlerin kopyalanacagi klasor (exe'ye goreceli)
images_dir = images
; Arayuz temasi: dark | light
theme = dark
; Tablo onizlemesinde gosterilecek maksimum kayit (0 = sinirsiz)
max_rows = 0
