# PostgreSQL (GitHub / Docker ile hizli baslangic)
# Calistirma: docker compose up -d
# Sonra: scripts/init-databases.sql ile DB olusturun veya KULLANICI-VERITABANI-OLUSTUR.bat

services:
  postgres:
    image: postgres:16-alpine
    container_name: karadeniz-turizm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1234"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  pgdata:
